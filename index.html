<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>take-light — neon-dusk jetpack arena</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #14102a;
      }
      #root {
        position: fixed;
        inset: 0;
      }
      #game-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #game-canvas,
      #stick-left,
      #stick-right,
      #dash-btn {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #stick-left,
      #stick-right {
        position: fixed;
        bottom: calc(16px + env(safe-area-inset-bottom));
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 2px solid rgba(245, 236, 255, 0.35);
        background: rgba(20, 12, 44, 0.35);
        opacity: 0.55;
        z-index: 5;
      }
      #stick-left {
        left: calc(16px + env(safe-area-inset-left));
      }
      #stick-right {
        right: calc(16px + env(safe-area-inset-right));
      }
      #dash-btn {
        position: fixed;
        right: calc(32px + env(safe-area-inset-right));
        bottom: calc(160px + env(safe-area-inset-bottom));
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 2px solid rgba(255, 209, 102, 0.7);
        background: rgba(255, 209, 102, 0.25);
        color: #ffd166;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        letter-spacing: 0.1em;
        opacity: 0.7;
        z-index: 5;
        cursor: pointer;
      }
      #dash-btn.active {
        background: rgba(255, 209, 102, 0.55);
      }
      .stick-knob {
        position: absolute;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(245, 236, 255, 0.55);
        pointer-events: none;
      }
      @media (pointer: coarse) {
        #stick-left,
        #stick-right {
          width: 148px;
          height: 148px;
          opacity: 0.85;
        }
        #dash-btn {
          width: 88px;
          height: 88px;
          opacity: 0.9;
        }
      }
      #menu {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        color: #f5ecff;
        font-family: system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #menu h1 {
        margin: 0;
        font-size: 2.5rem;
        letter-spacing: 0.2em;
      }
      #menu p {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: 0.4em;
      }
      #menu button {
        pointer-events: auto;
        margin-top: 1rem;
        padding: 0.75rem 2.5rem;
        font-size: 1.1rem;
        letter-spacing: 0.2em;
        color: #14102a;
        background: #ffd166;
        border: none;
        border-radius: 999px;
        cursor: pointer;
      }
      #dev-overlay {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        padding: 4px 8px;
        color: #9ef0c8;
        background: rgba(10, 6, 24, 0.65);
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        pointer-events: none;
      }
      #fx-layer {
        position: fixed;
        inset: 0;
        z-index: 8;
        overflow: hidden;
        pointer-events: none;
      }
      .damage-number {
        position: absolute;
        transform: translate(-50%, -50%);
        color: #ffd166;
        font-family: system-ui, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-shadow:
          0 0 8px rgba(255, 209, 102, 0.9),
          0 0 2px rgba(20, 16, 42, 0.9);
        animation: fx-float-up 1.2s ease-out forwards;
      }
      .hit-marker {
        position: absolute;
        width: 14px;
        height: 14px;
        transform: translate(-50%, -50%) rotate(45deg);
        border: 2px solid #f5ecff;
        box-shadow: 0 0 8px rgba(245, 236, 255, 0.9);
        animation: fx-flash 0.3s ease-out forwards;
      }
      @keyframes fx-float-up {
        from {
          opacity: 1;
          margin-top: 0;
        }
        to {
          opacity: 0;
          margin-top: -48px;
        }
      }
      @keyframes fx-flash {
        from {
          opacity: 1;
          scale: 1.2;
        }
        to {
          opacity: 0;
          scale: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <canvas id="game-canvas"></canvas>
      <div id="menu" data-state="BOOT">
        <h1>take-light</h1>
        <p>MENU</p>
        <button id="start-btn" type="button">Start</button>
      </div>
      <div id="dev-overlay">fps: 0 tick: 0</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
