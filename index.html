<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14102a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>take-light — neon-dusk jetpack arena</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #14102a;
        touch-action: none;
        max-width: 100vw;
        overflow-x: hidden;
        overflow-x: clip;
      }
      #root,
      #menu {
        max-width: 100vw;
      }
      #portrait-notice {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 30;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        max-width: 100vw;
        padding: max(env(safe-area-inset-top), 12px)
          max(env(safe-area-inset-right), 16px)
          max(env(safe-area-inset-bottom), 12px)
          max(env(safe-area-inset-left), 16px);
        color: #f5ecff;
        background: rgba(20, 16, 42, 0.85);
        font-family: system-ui, sans-serif;
        font-size: 1.1rem;
        letter-spacing: 0.05em;
        text-align: center;
        pointer-events: none;
      }
      #portrait-notice .portrait-card {
        box-sizing: border-box;
        max-width: min(90vw, 26rem);
        min-width: 0;
        padding: 1.25rem 1.5rem;
        border: 1px solid rgba(245, 236, 255, 0.22);
        border-radius: 12px;
        background: rgba(16, 10, 38, 0.7);
        text-wrap: balance;
        overflow-wrap: anywhere;
      }
      @media (orientation: portrait) {
        #portrait-notice {
          display: flex;
        }
        #menu,
        #stick-left,
        #stick-right,
        #dash-btn,
        #hud {
          display: none !important;
        }
      }
      #root {
        position: fixed;
        inset: 0;
      }
      #game-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #game-canvas,
      #stick-left,
      #stick-right,
      #dash-btn {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #stick-left,
      #stick-right {
        position: fixed;
        bottom: calc(16px + env(safe-area-inset-bottom));
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 2px solid rgba(245, 236, 255, 0.35);
        background: rgba(20, 12, 44, 0.35);
        opacity: 0.55;
        z-index: 5;
      }
      #stick-left {
        left: calc(16px + env(safe-area-inset-left));
      }
      #stick-right {
        right: calc(16px + env(safe-area-inset-right));
      }
      #dash-btn {
        position: fixed;
        right: calc(32px + env(safe-area-inset-right));
        bottom: calc(160px + env(safe-area-inset-bottom));
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 2px solid rgba(255, 209, 102, 0.7);
        background: rgba(255, 209, 102, 0.25);
        color: #ffd166;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        letter-spacing: 0.1em;
        opacity: 0.7;
        z-index: 5;
        cursor: pointer;
      }
      #dash-btn.active {
        background: rgba(255, 209, 102, 0.55);
      }
      .stick-knob {
        position: absolute;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(245, 236, 255, 0.55);
        pointer-events: none;
      }
      @media (pointer: coarse) {
        #stick-left,
        #stick-right {
          width: 148px;
          height: 148px;
          opacity: 0.85;
        }
        #dash-btn {
          width: 88px;
          height: 88px;
          opacity: 0.9;
        }
      }
      @media (pointer: fine) {
        #stick-left,
        #stick-right,
        #dash-btn {
          display: none !important;
        }
      }
      body.has-touch #stick-left,
      body.has-touch #stick-right,
      body.has-touch #dash-btn {
        display: block !important;
      }
      #menu {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        box-sizing: border-box;
        max-width: 100vw;
        padding: max(env(safe-area-inset-top), 12px)
          max(env(safe-area-inset-right), 16px)
          max(env(safe-area-inset-bottom), 12px)
          max(env(safe-area-inset-left), 16px);
        color: #f5ecff;
        font-family: system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #menu .panel {
        box-sizing: border-box;
        width: 100%;
        max-width: min(calc(100vw - 32px), 28rem);
        min-width: 0;
      }
      #menu .panel > * {
        min-width: 0;
        max-width: 100%;
      }
      #go-summary {
        letter-spacing: normal;
        text-align: center;
        text-wrap: balance;
        overflow-wrap: anywhere;
        max-width: 100%;
      }
      #leaderboard {
        max-width: 100%;
        padding-inline: 0.5rem;
        box-sizing: border-box;
        overflow-wrap: anywhere;
      }
      #menu form {
        max-width: 100%;
        box-sizing: border-box;
      }
      #menu input {
        max-width: 100%;
        box-sizing: border-box;
        width: min(100%, 16rem);
      }
      #menu h1 {
        margin: 0;
        font-size: clamp(1.5rem, 8vw, 2.5rem);
        letter-spacing: 0.2em;
        overflow-wrap: anywhere;
        max-width: 100%;
      }
      #menu p {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: 0.4em;
      }
      #menu button {
        pointer-events: auto;
        margin-top: 1rem;
        padding: 0.75rem 2.5rem;
        font-size: 1.1rem;
        letter-spacing: 0.2em;
        color: #14102a;
        background: #ffd166;
        border: none;
        border-radius: 999px;
        cursor: pointer;
      }
      @media (max-height: 430px) and (orientation: landscape) {
        #stick-left,
        #stick-right {
          width: 96px;
          height: 96px;
          bottom: calc(8px + env(safe-area-inset-bottom));
        }
        #stick-left {
          left: calc(8px + env(safe-area-inset-left));
        }
        #stick-right {
          right: calc(8px + env(safe-area-inset-right));
        }
        #dash-btn {
          width: 64px;
          height: 64px;
          right: calc(112px + env(safe-area-inset-right));
          bottom: calc(8px + env(safe-area-inset-bottom));
        }
        #hud {
          gap: 4px 8px;
          padding: 4px 8px;
          font-size: 12px;
        }
        #menu {
          gap: 0.25rem;
        }
        #menu .panel {
          padding: 0.75rem 1rem;
          gap: 0.25rem;
        }
        #menu h1 {
          font-size: 1.25rem;
        }
      }
      #dev-overlay {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        padding: 4px 8px;
        color: #9ef0c8;
        background: rgba(10, 6, 24, 0.65);
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        pointer-events: none;
      }
      #fx-layer {
        position: fixed;
        inset: 0;
        z-index: 8;
        overflow: hidden;
        pointer-events: none;
      }
      .damage-number {
        position: absolute;
        transform: translate(-50%, -50%);
        color: #ffd166;
        font-family: system-ui, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-shadow:
          0 0 8px rgba(255, 209, 102, 0.9),
          0 0 2px rgba(20, 16, 42, 0.9);
        animation: fx-float-up 1.2s ease-out forwards;
      }
      .hit-marker {
        position: absolute;
        width: 14px;
        height: 14px;
        transform: translate(-50%, -50%) rotate(45deg);
        border: 2px solid #f5ecff;
        box-shadow: 0 0 8px rgba(245, 236, 255, 0.9);
        animation: fx-flash 0.3s ease-out forwards;
      }
      @keyframes fx-float-up {
        from {
          opacity: 1;
          margin-top: 0;
        }
        to {
          opacity: 0;
          margin-top: -48px;
        }
      }
      @keyframes fx-flash {
        from {
          opacity: 1;
          scale: 1.2;
        }
        to {
          opacity: 0;
          scale: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <canvas id="game-canvas"></canvas>
      <div id="portrait-notice" role="note">
        <div class="portrait-card">Rotate your device to landscape to play take-light</div>
      </div>
      <div id="menu" data-state="BOOT">
        <h1>take-light</h1>
        <p>MENU</p>
        <button id="start-btn" type="button">Start</button>
      </div>
      <div id="dev-overlay" hidden>fps: 0 tick: 0</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
